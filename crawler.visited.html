{% if pages %}
    <h5 class="mb-3">Results:</h5>
    <div class="list-group">
        {% for page in pages %}
            <a href="{{ page }}" target="_blank" class="list-group-item list-group-item-action bg-secondary text-light mb-2">
                {{ page }}
            </a>
        {% endfor %}
    </div>
{% elif request.method == 'POST' %}
    <p class="text-warning text-center">No results found for "{{ query }}"</p>
{% endif %}
