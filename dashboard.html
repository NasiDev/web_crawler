<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5 text-center">
    <h2 class="mb-4">📊 Sentiment Analysis Dashboard</h2>
    <p>This chart shows the overall sentiment distribution from crawled pages.</p>

    {% if img_data %}
        <img src="data:image/png;base64,{{ img_data }}" alt="Sentiment Chart" class="img-fluid rounded shadow mt-4">
    {% else %}
        <div class="alert alert-warning mt-4" role="alert">
            {{ message or "No data available for visualization." }}
        </div>
    {% endif %}
</div>

</body>
</html>
