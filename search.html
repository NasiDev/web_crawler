<!-- templates/search.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">🔎 Web Crawler Search</h2>
    <form method="POST" class="d-flex justify-content-center mb-4">
        <input type="text" name="query" class="form-control w-50 me-2" placeholder="Search by keyword, URL, or entity" required>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    {% if pages %}
        <h5 class="mb-3">Results:</h5>
        <div class="list-group">
            {% for page in pages %}
                <a href="{{ page }}" target="_blank" class="list-group-item list-group-item-action bg-secondary text-light mb-2">
                    {{ page }}
                </a>
            {% endfor %}
        </div>
    {% elif request.method == 'POST' %}
        <p class="text-warning text-center">No results found for "{{ query }}"</p>
    {% endif %}
</div>

</body>
</html>
