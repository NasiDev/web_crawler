<!-- visited_pages.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visited Pages</title>
</head>
<body>
    <h1>Visited Pages</h1>
    {% if pages %}
        <ul>
        {% for page in pages %}
            <li><a href="{{ page }}" target="_blank">{{ page }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No pages visited yet.</p>
    {% endif %}
</body>
</html>
